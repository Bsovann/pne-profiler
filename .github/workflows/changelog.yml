name: Changelog

on:
  pull_request:
    branches: ['rc/**']
    # labeled/unlabeled so toggling skip-changelog re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - run: Changelogs/fragments.py check
      - name: Require a ticket fragment
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- \
            Changelogs/ChangeFragments/ \
            ':!Changelogs/ChangeFragments/changelog.yml' \
            ':!Changelogs/ChangeFragments/PG-0000-Template.yml')
          if [ -z "$changed" ]; then
            echo "::error::Add Changelogs/ChangeFragments/<JIRA-KEY>.yml (copy PG-0000-Template.yml), or label the PR skip-changelog."
            exit 1
          fi
          echo "Fragments: $changed"
