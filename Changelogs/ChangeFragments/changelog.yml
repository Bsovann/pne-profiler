---
Version: 0.1.0
Release_Date: 2026-10-03
Trivial_Changes:
  - (README) - documented the release steps for generating the RPM changelog.
  - (Docs) - documented the ticket branch, fragment, and review workflow in README and CLAUDE.md.
  - (Git) - added a commit-msg hook in .githooks that rejects messages not starting with a SCRUM-<n> Jira key.
  - (Tests) - added CLI integration tests covering --version, a successful run with hyphenated args, the documented run -- ./program args form, non-zero exit propagation, and command-not-found.
  - (Docs) - documented the per-release changelog.yml format and fold flow in README and CLAUDE.md.
Minor_Changes:
  - (CI) - added a typos spell-check job to the CI pipeline.
  - (RPM) - added an RPM spec for packaging the pne-profiler binary.
  - (RPM) - added update-changelog.py to generate the spec's %changelog entry from changelog.yml.
  - (Changelog) - added fragments.py to validate ticket fragments and fold them into changelog.yml.
  - (CI) - added a changelog workflow that requires a valid fragment on PRs to rc branches.
  - (Changelog) - renamed the template's Trivial Changes key to Trivial_Changes.
  - (Licensing) - added the Apache-2.0 LICENSE and set the license in Cargo.toml and the RPM spec.
  - (Toolchain) - pinned the Rust toolchain to 1.98.1 in rust-toolchain.toml and CI.
  - (CI) - pinned third-party actions to commit SHAs, limited workflow permissions to contents read, and enabled Dependabot for GitHub Actions.
  - (Changelog) - made fragments.py fold set Version in changelog.yml and Cargo.toml by bumping the last released version by major, minor, or patch.
  - (pne-cli) - added clap argument parsing with a run subcommand that forwards the target command and its arguments unchanged.
  - (pne-cli) - added spawning of the target command with inherited stdio.
  - (pne-cli) - exited with the target's exit code, 128 + signal when the target is killed, 127 when the command is not found, and 126 when it cannot be executed.
  - (Changelog) - changed changelog.yml to keep one YAML document per release, oldest first, instead of a single release.
  - (Changelog) - made fragments.py fold into the last release and start a new Release_Date TBD release once the last one has a date.
  - (Changelog) - changed fold to bump Version from the previous release in changelog.yml instead of the RPM spec's newest %changelog entry.
  - (Changelog) - made fragments.py check validate every release and reject a TBD Release_Date on any release but the last.
  - (RPM) - changed update-changelog.py to build the %changelog entry from the last release in changelog.yml.
---
Version: 0.2.0
Release_Date: 2026-10-12
Trivial_Changes:
  - (Tests) - added pne-core unit tests for Bytes::from_kib, ResourceUsage::cpu_time, and RunStats::cpu_utilization.
  - (Tests) - added pne-perf unit tests for wait4 covering exit codes, killing signals, and max RSS.
  - (Tests) - added pne-perf unit tests for the timeval to Duration conversion covering zero, seconds plus microseconds, the microsecond unit, the largest microsecond value, and multi-day runs.
  - (Tests) - added pne-cli unit tests for the resource usage report's seconds, CPU percentage, and MiB conversions.
  - (Tests) - added CLI integration tests for the resource usage report on stderr and the 128 + signal exit code.
  - (Docs) - documented in CLAUDE.md that pne-perf also hosts other raw syscalls such as wait4.
  - (Tests) - added whole-string tests in pne-core for the resource usage report, covering a typical run, display rounding, CPU usage above 100%, and zero wall time.
  - (Tests) - changed the CLI report integration test to compare the full stderr output with the numbers masked.
  - (Tests) - added pne-perf tests for the WaitError messages and its OS error source.
  - (Tests) - added a CLI integration test for exit code 126 when the target is not executable.
Minor_Changes:
  - (pne-core) - added the Bytes, ExitOutcome, ResourceUsage, and RunStats types for reporting the target's resource usage.
  - (pne-core) - added Bytes::from_kib to convert kibibyte counts such as getrusage's ru_maxrss to bytes.
  - (pne-core) - added ResourceUsage::cpu_time and RunStats::cpu_utilization, which returns CPU time over wall time or None for a zero wall time.
  - (pne-perf) - added a safe wait4 wrapper over libc that takes ownership of a spawned Child, reaps it, and returns its exit outcome, user and system CPU time, and max RSS.
  - (pne-cli) - changed run to reap the target with wait4 and print its wall time, user and system CPU time, CPU usage, and max RSS to stderr after it exits.
  - (pne-core) - moved the resource usage report into a Display impl on RunStats.
  - (pne-perf) - changed wait4 to return a typed WaitError built with thiserror instead of io::Error.
  - (pne-cli) - changed error handling to anyhow, printing each error with its full context chain while keeping exit codes 126 and 127 for targets that cannot be started.
---
Version: 0.3.0
Release_Date: 2026-10-29
Trivial_Changes:
  - (README) - documented how to run test coverage locally with cargo-llvm-cov in the Contribution section.
  - (Docs) - moved the release guide from README.md into RELEASE.md and linked it from README, CLAUDE.md, and the changelog scripts.
  - (Tests) - added CLI integration tests that send SIGINT and SIGQUIT to the profiler's process group and check the report still prints with exit code 130 or 131.
  - (Tests) - added unit tests for fragments.py next_version covering 0.x and 1.x bumps, trivial-only releases, the first release, and the 1.0.0 opt-in, and ran them in the changelog workflow.
  - (Docs) - documented in RELEASE.md that changelog.yml is the single source of the next version, that rc branches are named rc/next, and that pre-release versions such as 0.3.0-rc.1 are not used.
  - (Docs) - changed the release steps to derive the git tag name from Cargo.toml instead of typing it.
  - (Docs) - added ARCHITECTURE.md describing the crate structure and dependency rule, the runtime flow of a run, the design principles, and the planned Collector trait and multi-node agents.
  - (README) - linked ARCHITECTURE.md from the workspace layout section.
  - (Tests) - replaced the nonzero max RSS test with one where the target allocates 64 MiB and the reported max RSS must land between 64 and 72 MiB.
  - (Tests) - added a test that reproduces the max RSS floor a target inherits from its parent at exec, through posix_spawn but not fork.
  - (Tests) - added whole-string unit tests for the report's time and memory formatting at every unit boundary, including values that only cross a boundary after rounding, and a report test for a 30-day, 200 GiB run.
  - (pne-cli) - replaced the downcast that picked exit codes 126 and 127 for run failures with a typed RunError whose variants each map to an exit code, so a new failure mode can no longer be mistaken for a spawn failure; exit codes and error messages are unchanged.
  - (Tests) - added unit tests for the run error to exit code mapping, including a wait4 failure caused by NotFound, which must exit 1 rather than 127.
Minor_Changes:
  - (CI) - added a coverage job that runs cargo llvm-cov on PRs and pushes and writes the line coverage summary to the job summary.
  - (CI) - added a README coverage badge that CI updates on pushes to master and rc branches through a shields.io endpoint file on the badges branch.
  - (pne-cli) - changed run to survive Ctrl-C (SIGINT) and Ctrl-\ (SIGQUIT) while the target runs, using signal-hook, so the report still prints when a run is interrupted; the target keeps the default handling for both signals.
  - (Changelog) - changed fragments.py fold to bump the minor version for Major_Changes while the major version is 0, and added fold --stable as the explicit opt-in to 1.0.0.
  - (Changelog) - made fragments.py check reject a released Version that is not greater than the previous release's.
  - (RPM) - made update-changelog.py refuse a release that reuses an already-released Version, with a message saying how to proceed.
  - (pne-core) - changed the report to print times of 60 s and above as h:mm:ss.s, with days from 24 h (e.g. 30d 0:00:00.0), and max RSS in KiB, MiB, GiB, or TiB with one decimal place, choosing the unit from the rounded value; times under 60 s keep the N.NNN s format.