---
Trivial_Changes:
  - (Tests) - added whole-string tests in pne-core for the resource usage report, covering a typical run, display rounding, CPU usage above 100%, and zero wall time.
  - (Tests) - changed the CLI report integration test to compare the full stderr output with the numbers masked.
  - (Tests) - added pne-perf tests for the WaitError messages and its OS error source.
  - (Tests) - added a CLI integration test for exit code 126 when the target is not executable.
Minor_Changes:
  - (pne-core) - moved the resource usage report into a Display impl on RunStats.
  - (pne-perf) - changed wait4 to return a typed WaitError built with thiserror instead of io::Error.
  - (pne-cli) - changed error handling to anyhow, printing each error with its full context chain while keeping exit codes 126 and 127 for targets that cannot be started.